<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page_description }}">
    <link rel="canonical" href="{{ page_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ profile.name }}">
    <meta property="og:title" content="{{ profile.name }} | {{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ page_url }}">
    <meta property="og:image" content="{{ og_image_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ profile.og_image_alt }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="{{ profile.x_handle }}">
    <meta name="twitter:title" content="{{ profile.name }} | {{ page_title }}">
    <meta name="twitter:description" content="{{ page_description }}">
    <meta name="twitter:image" content="{{ og_image_url }}">
    <meta name="twitter:image:alt" content="{{ profile.og_image_alt }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="32x32">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <title>{{ profile.name }} | {{ page_title }}</title>
    <script>
    (function () {
        try {
            var storedTheme = localStorage.getItem("theme");
            if (storedTheme === "light" || storedTheme === "dark") {
                document.documentElement.setAttribute("data-theme", storedTheme);
                return;
            }
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        } catch (err) {
            /* no-op */
        }
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css', v='20261111a') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('home') }}" aria-label="Kaleb Coleman home">
                <span class="brand-mark" aria-hidden="true">KC</span>
                <span class="brand-copy">
                    <span class="brand-name">{{ profile.name }}</span>
                    <span class="brand-role">{{ profile.degree }} · {{ profile.graduation }}</span>
                </span>
            </a>

            <nav class="site-nav" aria-label="Primary navigation">
                {% for item in nav_items %}
                <a
                    href="{{ url_for(item.endpoint) }}"
                    class="nav-link {% if active_page == item.endpoint %}is-active{% endif %}"
                    {% if active_page == item.endpoint %}aria-current="page"{% endif %}
                >
                    {{ item.label }}
                </a>
                {% endfor %}
            </nav>

            <div class="header-actions">
                <button
                    id="theme-toggle"
                    class="theme-toggle"
                    type="button"
                    aria-label="Toggle color theme"
                    aria-pressed="false"
                >
                    <span id="theme-toggle-icon" aria-hidden="true">◐</span>
                </button>
                <a class="resume-link" href="{{ url_for('resume') }}" target="_blank" rel="noopener noreferrer">
                    Resume
                </a>
            </div>
        </header>

        <main id="main-content" class="site-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div>
                <p class="footer-title">{{ profile.name }}</p>
                <p class="footer-text">{{ profile.summary }}</p>
            </div>
            <div class="footer-links">
                <a href="mailto:{{ profile.email }}">{{ profile.email }}</a>
                <a href="{{ profile.linkedin_url }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="{{ profile.github_url }}" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="{{ profile.x_url }}" target="_blank" rel="noopener noreferrer">X</a>
            </div>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</body>
</html>
