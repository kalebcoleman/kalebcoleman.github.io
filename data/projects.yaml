# Projects shown on the site. One entry per project; see README.md ("Adding a project").
#
# Required: slug (unique, used as the page anchor), name, repo_name (the small label above the
#           card), summary, stack (list).
# Optional: repo_url      public repository only. Never link a private repository.
#           badge         short status label, e.g. "Runs in simulation".
#           tagline       one or two sentences used on the home page. Needed for any slug in home_layout.
#           highlights    list of bullet points.
#           links         list of {label, url} or {label, file} (file = path under static/).
#           status        any of simulated / developing / planned (see STATUS_LABELS in app.py).
#           limits, credits
#           media         {kind: video|image, src, poster (video), width, height, alt, caption}.
#                         Needed for the home-page lead; videos must stay under 1 MB.
#           image         {file, alt} plus url, or endpoint (+ anchor), for compact cards.
#           gallery       list of {file, alt, caption}.
#           placeholder   short text shown when a home-page card has no media.
#           layout        "feature" renders a full-width panel after the grid; it can also carry
#                         eyebrow, contribution, and figures: [{file, alt, caption, url | link_file, link_label}].
#
# Order here is the order on the Projects page. The home page is driven by home_layout.

home_layout:
  lead: g1-locomotion-lab
  secondary:
    - contact-assembly-lab
    - isaac-mcp
    - quadrotor-control
    - turtlebot3-ros2-lidar
  more_robotics:
    - jenga-direction
  data_science:
    - datafest-2026
    - nba-win-modeling

projects:
  - slug: g1-locomotion-lab
    name: Unitree G1 Humanoid Locomotion
    repo_name: g1-locomotion-lab
    repo_url: https://github.com/kalebcoleman/g1-locomotion-lab
    badge: Runs in simulation
    tagline: >-
      A simulated Unitree G1 humanoid trained to walk in Isaac Lab on Newton/MuJoCo-Warp physics. In the
      published evaluation, 237 of 256 robots stayed up through a 24-second stand, walk, turn, and stop test
      with random pushes.
    summary: >-
      Training and evaluating Unitree G1 locomotion in Isaac Lab with the Newton/MuJoCo-Warp physics backend.
      The task, rewards, and PPO setup are Isaac Lab's; my work is the training run on Newton, a scripted
      evaluation with pushes, a sweep across saved checkpoints, and a study of when and where robots fall.
    stack: [Isaac Lab 3.0, Newton / MuJoCo-Warp, PPO (rsl_rl), Unitree G1, Python]
    highlights:
      - >-
        Published evaluation: 237 of 256 simulated robots stayed up through a 24-second scripted stand, walk,
        turn, and stop test with random pushes of up to 0.5 m/s. Two reruns gave 231 and 233. This is one
        policy from one training seed.
      - >-
        Most falls happen while turning: 17 of the 19 falls in the published run were in the turn phase.
      - >-
        Follow-up pilots measured where the policy breaks: half of the robots fall at about 2.2 m/s of added
        push speed, and the flat-ground policy keeps at least 80% survival on a 19 degree downhill and a
        9 degree uphill.
      - >-
        Getting back up after a fall is work in progress: the current baseline passes strict validity checks
        on 68.2% of 256 held-out lying poses, and handing over from getting up to walking is the weak link.
    links:
      - label: Walking write-up
        url: https://github.com/kalebcoleman/g1-locomotion-lab/blob/main/docs/WALKING.md
      - label: Evaluation protocol
        url: https://github.com/kalebcoleman/g1-locomotion-lab/blob/main/EVAL_PROTOCOL.md
    status:
      simulated: A walking policy and its scripted 256-robot evaluation, on flat ground in Isaac Lab.
      developing: Fall recovery and the hand-over from getting up to walking.
      planned: Any hardware run. Nothing here has been tried on a physical G1.
    limits: >-
      Simulation only, one policy from one training seed, with no repeats or confidence intervals. The
      task, rewards, and PPO are upstream Isaac Lab components, not a new algorithm of mine.
    credits: >-
      Built on Isaac Lab (NVIDIA and contributors), the Unitree G1 model by Unitree Robotics, rsl_rl,
      Newton, and MuJoCo-Warp.
    image:
      file: images/g1-before-after-poster.jpg
      alt: Two groups of simulated Unitree G1 humanoids on a checkered floor, untrained on the left and walking on the right
      url: https://github.com/kalebcoleman/g1-locomotion-lab
    media:
      kind: video
      src: media/g1-before-after.mp4
      poster: images/g1-before-after-poster.jpg
      width: 960
      height: 270
      alt: >-
        Two groups of 16 simulated Unitree G1 humanoids following the same commands. At training iteration 0
        on the left they collapse; at iteration 1499 on the right they stay upright and walk
      caption: >-
        Same scripted commands at training iteration 0 (left) and 1499 (right), 16 simulated robots per side.
        Fallen robots are reset in place, and this clip is not footage of the 256-robot test.

  - slug: contact-assembly-lab
    name: Contact-Rich Robotic Assembly Testbed
    repo_name: contact-assembly-lab
    repo_url: https://github.com/kalebcoleman/contact-assembly-lab
    badge: Runs in simulation
    tagline: >-
      A UR5e with an RG2 gripper assembles structures from interlocking parts in Isaac Sim 6.2 while a
      joint-strength model decides, at every physics step, whether each connection holds. 21 of 29
      catalogued structures complete, and every failure is traced to a cause.
    summary: >-
      A contact-rich assembly testbed in Isaac Sim 6.2. A UR5e builds catalogued structures from
      interlocking parts, and a joint-strength physics model breaks any connection that is overloaded. The
      project asks what a robot can assemble reliably and why builds fail, and it is the contact-physics
      testbed for my Jenga research.
    stack: [Isaac Sim 6.2, PhysX 5.9, UR5e / RG2, Python]
    highlights:
      - >-
        Ported the simulator from Isaac Sim 5.1 and Python 3.11 to Isaac Sim 6.2 and Python 3.12, and added a
        weld-torque correction for PhysX 5.9's CPU TGS solver, which misreported the loads the breakage model
        reads.
      - >-
        Wrote an assembly controller that builds any structure config, releases each part without touching
        its neighbours, and logs every gripper contact.
      - >-
        In the catalog of 29 structures, 21 complete in simulation at their saved settings. The other 8,
        including two cantilever break tests designed to fail, do not.
      - >-
        Failures led to specific fixes: easing off 0.5 mm before release, or releasing in 0.5 s instead of
        1 s, stopped joints breaking as the gripper opened. Tables with no room for the fingers and 4-stud
        joints that break are still open.
      - >-
        Sweeps are reproducible: each records its configs, settings, and controller commit, and repeated
        runs gave identical results on the reference machine. A local dashboard shows every run.
    links:
      - label: Structure catalog
        url: https://github.com/kalebcoleman/contact-assembly-lab/blob/main/docs/STRUCTURES.md
      - label: Failure analysis
        url: https://github.com/kalebcoleman/contact-assembly-lab/blob/main/experiments/ur5e_structures/FAILURES.md
      - label: Isaac Sim 6.2 port notes
        url: https://github.com/kalebcoleman/contact-assembly-lab/blob/main/docs/ISAACSIM_6.2_PORT.md
    status:
      simulated: Structure builds and break tests in Isaac Sim 6.2, judged by simulator ground truth.
      developing: More ways to grip parts, such as long-side grips and re-grasping, to remove the gripper limits found so far.
      planned: Building the same structures on the real UR5e and comparing what fails; carrying the evaluation methods over to Jenga.
    limits: >-
      All results are simulation; no real-robot trials have been run. A completed run is one deterministic
      run, not evidence of robustness.
    credits: >-
      Builds on BrickSim by Haowei Wen, Ruixuan Liu, Weiyi Piao, Siyu Li, and Changliu Liu (Intelligent
      Control Lab, Carnegie Mellon University; MIT License). The connection and breakage physics, the native
      extension, and the simulator UI are theirs. The UR5e, gripper, and bench models are lab-supplied.
    image:
      file: images/contact-assembly-bridge-poster.jpg
      alt: Isaac Sim view of an RG2 gripper lowering a part onto a small arch bridge assembled on a baseplate
      url: https://github.com/kalebcoleman/contact-assembly-lab
    media:
      kind: video
      src: media/contact-assembly-bridge.mp4
      poster: images/contact-assembly-bridge-poster.jpg
      width: 960
      height: 540
      alt: >-
        Isaac Sim recording of a UR5e gripper picking up loose parts one at a time and assembling a
        seven-part arch bridge on a baseplate
      caption: The UR5e assembling the seven-part arch bridge in Isaac Sim 6.2, from the repository.
    gallery:
      - file: images/contact-assembly-dashboard.jpg
        alt: Dashboard grid listing all 29 catalogued structures with their simulation run results
        caption: The run dashboard listing all 29 catalogued structures and their simulation results.

  - slug: isaac-mcp
    name: Isaac MCP
    repo_name: isaac-mcp · open source
    repo_url: https://github.com/kalebcoleman/isaac-mcp
    badge: Runs in simulation
    tagline: >-
      An MCP server that lets AI agents build Isaac Sim scenes, load and drive robots, read cameras and
      LiDAR, and run Isaac Lab training and evaluation jobs.
    summary: >-
      An MCP server that lets AI agents drive NVIDIA Isaac Sim and Isaac Lab: build scenes, import robots,
      read cameras and LiDAR, and run Isaac Lab train, evaluate, and play jobs. It is the tooling I use to
      stand up and inspect simulated systems quickly.
    stack: [Python, MCP, Isaac Sim, Isaac Lab, ROS 2]
    highlights:
      - >-
        Lists 129 tools by default, or 138 with optional groups, covering scene and asset authoring, joints
        and physics, cameras and LiDAR, ROS 2 TF, Isaac Lab jobs, and screenshots and recordings.
      - >-
        The README examples are captures from live runs with a record of how each was made: a warehouse
        built in one call, robots imported from public repositories, and a Unitree G1 walking policy trained
        through the Isaac Lab tools. They illustrate the tools and are not benchmarks.
      - >-
        The fuller G1 walking evaluation, 237 of 256 robots through a pushed test, is its own project:
        Unitree G1 Humanoid Locomotion.
    links:
      - label: Example prompts
        url: https://github.com/kalebcoleman/isaac-mcp#things-you-can-ask
      - label: Compatibility matrix
        url: https://github.com/kalebcoleman/isaac-mcp/blob/main/docs/COMPATIBILITY.md
    status:
      simulated: >-
        Documented builds are Isaac Sim 6.2.0.0 with Isaac Lab 3.0.0 and Isaac Sim 5.1.0.0 with Isaac Lab
        2.3.2. Every demo is simulation only.
      developing: Pre-release hardening and wider compatibility testing (Linux x86_64).
      planned: Further robotics and learning workflows tracked on the project checklist.
    limits: Pre-release and simulation only; no hardware deployment.
    credits: >-
      Built on Aldrin Inbaraj's omni-kit-mcp and isaac-sim-mcp. The example robots and tasks belong to
      their owners, including NVIDIA's Isaac Lab and public Carter model.
    image:
