# Projects live in data/projects.yaml. Both files are loaded by app.py.

profile:
  name: Kaleb Coleman
  email: kaleb.a.coleman@gmail.com
  headline: Perception, simulation, and control for robot digital twins
  intro: >-
    I am an M.S. AI Engineering (Robotics) student at ASU and a researcher in the RISE Lab. I use real
    UR5e wrist-camera recordings to reconstruct scenes in NVIDIA Isaac Sim, and I study quadrotor control
    and Unitree G1 locomotion in simulation. I came to robotics through data science and machine learning.
  direction: >-
    What works today is the perception step: recorded wrist-camera views can be matched to part poses and
    rebuilt in simulation. Taking a plan from that twin back to the physical robot is the longer-term goal
    and is not yet shown. The twins are not yet calibrated against hardware. With Dr. Wenlong Zhang, I am
    exploring a Jenga-playing robot that could use approaches such as model predictive control or
    reinforcement learning. That is a research direction, not a finished robot or a proven controller.
  summary: >-
    Digital twins, simulation, and control research, grounded in data science, machine learning, and
    enterprise security experience.
  degree: M.S. AI Engineering (Robotics), ASU
  minor: Cybersecurity minor
  graduation: Expected May 2028
  linkedin_url: https://www.linkedin.com/in/kalebacoleman/
  github_url: https://github.com/kalebcoleman
  x_url: https://x.com/kalebcoIeman
  x_handle: "@kalebcoIeman"
  site_url: https://kalebcoleman.github.io/
  site_description: >-
    Kaleb Coleman builds UR5e digital twins from wrist-camera data in Isaac Sim, with quadrotor control and Unitree G1 locomotion.
  # Social preview card (1200x630) and the text shown when a page is shared.
