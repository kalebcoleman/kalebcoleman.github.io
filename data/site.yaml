research_items:
  - title: Unitree G1 humanoid locomotion
    summary: >-
      Runs in simulation: a G1 walking policy trained in Isaac Lab on Newton/MuJoCo-Warp. In the published
      evaluation, 237 of 256 simulated robots stayed up through a 24-second pushed test. One policy, one
      training seed; fall recovery is still in progress.
  - title: Contact-rich robotic assembly
    summary: >-
      Runs in simulation: a UR5e assembly testbed in Isaac Sim 6.2 where a joint-strength model decides
      whether each connection holds. 21 of 29 catalogued structures complete. No real-robot trials yet.
  - title: Two-arm UR5e manipulation
    summary: >-
      Runs in simulation: coordinated shared-bar motion in Isaac Sim, with lab-supplied assets. Not validated
      on physical hardware.
  - title: Isaac MCP
    summary: >-
      Pre-release open-source MCP server for Isaac Sim and Isaac Lab, built on Aldrin Inbaraj's omni-kit-mcp
      and isaac-sim-mcp, so AI agents can build scenes, drive robots, and run training jobs.
  - title: Prescribed-time quadrotor control
    summary: >-
      Collaborating with John Lok, who led the controller development, on simulation research in MuJoCo.
      I reproduced an archived baseline and am working on timing and validation.
  - title: Jenga-playing robot (direction)
    summary: >-
      A research direction with Dr. Wenlong Zhang, possibly using model predictive control or reinforcement
      learning. It is not built, and no controller has been shown.

