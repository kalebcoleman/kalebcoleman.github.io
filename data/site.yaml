research_items:
  - title: twinsmith UR5e digital twin
    summary: >-
      Real UR5e wrist-camera clips are matched to part poses and rebuilt in Isaac Sim. The project cut mean
      read-and-match time from 11.64 s to 5.63 s on 29 clips, with unchanged pose estimates. Sending a plan
      back to the physical robot is not yet shown.
  - title: Energy-aware prescribed-time quadrotor trajectory following
    summary: >-
      Team project with John Lok, who led controller development. My part is organization, presentations,
      an NMPC baseline reproduction, and a timing study. The team's Nov 16, 2026 simulation update reports
      205, 224, and 248 successes out of 300 for fixed inertia, torque term only, and full adaptation.
      Nothing has flown.
  - title: Unitree G1 humanoid locomotion
    summary: >-
      Simulation only. Fall-to-walk success was 51.6% (387 of 750) with the recovery checkpoint and
      upper-body blend, against 28.7% (215 of 749) for the matched baseline. Walking: 237 of 256 stayed up
      through a pushed test. One policy, one training seed.
  - title: Contact-rich robotic assembly
    summary: >-
      Runs in simulation: a UR5e assembly testbed in Isaac Sim 6.2 where a joint-strength model decides
      whether each connection holds. 21 of 29 catalogued structures complete. No real-robot trials yet.
  - title: Jenga-playing robot (thesis direction)
    summary: >-
      My M.S. thesis direction with Dr. Wenlong Zhang: a real-to-sim-to-real UR5e that plays Jenga with a
      person, possibly using model predictive control or reinforcement learning. It is not built, and no
      controller has been shown.

