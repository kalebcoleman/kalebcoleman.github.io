profile:
  name: Kaleb Coleman
  email: kaleb.a.coleman@gmail.com
  headline: Digital twins of robotic systems, from arms and humanoids to quadrotors
  intro: >-
    I am an M.S. AI Engineering (Robotics) student at ASU and a researcher in the RISE Lab. I build
    simulation digital twins of robotic systems, including UR5e arms, a Unitree G1 humanoid, quadrotors,
    and contact-rich assembly, in NVIDIA Isaac Sim, Isaac Lab, and MuJoCo. I came to robotics through
    data science and machine learning.
  direction: >-
    The twins here are the simulation side: physics models of real robots, with measured results and
    written limits, not yet calibrated against hardware. The goal is sim-to-real, where data from the real
    robot improves the model and the control. With Dr. Wenlong Zhang, I am exploring a Jenga-playing robot
    that could use approaches such as model predictive control or reinforcement learning. That is a
    research direction, not a finished robot or a proven controller.
  summary: >-
    Digital twins, simulation, and control research, grounded in data science, machine learning, and
    enterprise security experience.
  degree: M.S. AI Engineering (Robotics), ASU
  minor: Cybersecurity minor
  graduation: Expected May 2028
